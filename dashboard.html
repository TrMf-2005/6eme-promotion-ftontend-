<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tableau de bord — Admin</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<main class="container" style="margin-top:20px; padding-bottom:40px;">
  <div class="stats-grid">
    <div class="card stat-card"><p>Membres validés</p><p id="statValidated" style="color:var(--orange);">—</p></div>
    <div class="card stat-card"><p>En attente</p><p id="statPending" style="color:var(--yellow);">—</p></div>
  </div>

  <p class="section-title">À valider</p>
  <div id="pendingList" style="display:flex; flex-direction:column; gap:10px;"></div>
  <p id="emptyPending" class="text-muted hidden">Aucune soumission en attente.</p>
</main>

<!-- Modal de détail complet avant validation -->
<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal">
    <div id="modalContent"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="nav.js"></script>
<script>
  requireAdminAccess();
  renderAdminNav("dashboard");

  async function loadStats() {
    const stats = await apiCall("/admin/stats", { isAdmin: true });
    document.getElementById("statValidated").textContent = stats.validated;
    document.getElementById("statPending").textContent = stats.pending;
  }

  function initials(prenom, nom) {
    return `${(prenom?.[0] || "").toUpperCase()}${(nom?.[0] || "").toUpperCase()}`;
  }

  async function loadPending() {
    const list = document.getElementById("pendingList");
    const empty = document.getElementById("emptyPending");
    const members = await apiCall("/admin/pending", { isAdmin: true });
    list.innerHTML = "";
    empty.classList.toggle("hidden", members.length > 0);

    members.forEach((m) => {
      const row = document.createElement("div");
      row.className = "card member-row";
      row.style.cursor = "pointer";
      row.onclick = () => openDetail(m._id);
      row.innerHTML = `
        <div class="avatar">${m.photoBase64 ? `<img src="${m.photoBase64}" />` : initials(m.prenom, m.nom)}</div>
        <div class="member-info">
          <p class="name">${m.prenom} ${m.nom}</p>
          <p class="city">${m.ville || ""}</p>
        </div>
      `;
      list.appendChild(row);
    });
  }

  async function openDetail(id) {
    const m = await apiCall(`/admin/pending/${id}`, { isAdmin: true });
    const content = document.getElementById("modalContent");
    content.innerHTML = `
      <p class="section-title" style="margin-top:0;">Soumission à valider</p>
      <div class="member-row" style="margin-bottom:14px;">
        <div class="avatar" style="width:52px;height:52px;">${m.photoBase64 ? `<img src="${m.photoBase64}" />` : initials(m.prenom, m.nom)}</div>
        <div>
          <p class="name" style="font-size:15px;">${m.prenom} ${m.nom}</p>
          <p class="city">${m.photoBase64 ? "Photo jointe" : "Sans photo"}</p>
        </div>
      </div>
      <div class="card" style="padding:4px 14px; margin-bottom:16px;">
        <div class="detail-row"><span>Téléphone</span><span>${m.telephone || "—"}</span></div>
        <div class="detail-row"><span>Ville</span><span>${m.ville || "—"}</span></div>
        <div class="detail-row"><span>Email</span><span>${m.email || "—"}</span></div>
        <div class="detail-row"><span>WhatsApp</span><span>${m.whatsapp || "—"}</span></div>
        <div class="detail-row"><span>TikTok</span><span>${m.tiktok || "—"}</span></div>
        <div class="detail-row"><span>Facebook</span><span>${m.facebook || "—"}</span></div>
        <div class="detail-row"><span>Autres détails</span><span>${m.autresDetails || "—"}</span></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="decide('${m._id}', 'validate')">Valider</button>
        <button class="btn btn-danger-outline" onclick="decide('${m._id}', 'refuse')">Refuser</button>
      </div>
    `;
    document.getElementById("modalBackdrop").classList.add("open");
  }

  async function decide(id, action) {
    await apiCall(`/admin/pending/${id}/${action}`, { method: "POST", isAdmin: true });
    document.getElementById("modalBackdrop").classList.remove("open");
    loadStats();
    loadPending();
  }

  document.getElementById("modalBackdrop").addEventListener("click", (e) => {
    if (e.target.id === "modalBackdrop") e.target.classList.remove("open");
  });

  loadStats();
  loadPending();
</script>
</body>
</html>
